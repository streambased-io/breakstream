
  union-roll:
    image: alpine/curl:8.17.0
    container_name: union-roll
    depends_on:
      - hyperstream
    volumes:
      - ../bin/lib/union_roll.sh:/union_roll.sh:ro
    environment:
      - TOPICS=branches transactions customers
      - INTERVAL_SECONDS=${UNION_ROLL_INTERVAL_SECONDS:-300}
      - HYPERSTREAM_CREDS=sbpk_12345678:sbsk_12345678
      - HYPERSTREAM_URL=http://hyperstream:9088
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        . /union_roll.sh; while true; do sleep $$INTERVAL_SECONDS; roll_topics $$TOPICS; done
